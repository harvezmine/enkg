# nginx untuk situs Every Nation Kelapa Gading di home server lewat Cloudflare Tunnel.
#
#   Pengunjung ──HTTPS──▶ Cloudflare ──tunnel──▶ cloudflared ──▶ nginx 127.0.0.1:8080 ──▶ PM2 127.0.0.1:3001
#
# SSL ditangani Cloudflare, jadi nginx cukup HTTP di localhost (tidak perlu certbot,
# tidak perlu membuka port di router). Dipasang otomatis oleh deploy/setup-server.sh:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/enkg
#   sudo ln -sfn /etc/nginx/sites-available/enkg /etc/nginx/sites-enabled/enkg
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kalau domain berbeda, ganti "everynationkg.com". Samakan port 3001 dengan PORT di .env.production.

upstream enkg_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

# www → domain utama
server {
    listen 127.0.0.1:8080;
    server_name www.everynationkg.com;
    return 301 https://everynationkg.com$request_uri;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name everynationkg.com localhost;

    # IP asli pengunjung dikirim Cloudflare lewat header ini; cloudflared terhubung dari localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Situs hanya menerima form teks (Life Group / Permohonan Doa).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Aset ber-hash dari Next.js — aman di-cache selamanya.
    location /_next/static/ {
        proxy_pass http://enkg_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://enkg_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        # Server Action Next.js mencocokkan Origin dengan host ini (proteksi CSRF).
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Pengunjung selalu masuk lewat HTTPS di Cloudflare.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
